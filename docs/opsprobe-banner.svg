<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">OpsProbe</title>
  <desc id="desc">A dark technical banner with a diagnostic pulse and the words private by default.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a46"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#66e2b4" stop-opacity=".34"/>
      <stop offset="1" stop-color="#66e2b4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#8fb2d8" stroke-opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="930" cy="178" r="225" fill="url(#glow)"/>
  <g fill="none" stroke="#66e2b4" stroke-linecap="round">
    <circle cx="930" cy="180" r="92" stroke-opacity=".22"/>
    <circle cx="930" cy="180" r="55" stroke-opacity=".35"/>
    <path d="M790 180h61l17-42 34 92 27-67 21 35 16-18h104" stroke-width="5"/>
    <circle cx="930" cy="180" r="7" fill="#66e2b4" stroke="none"/>
  </g>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <text x="72" y="94" fill="#66e2b4" font-size="16" letter-spacing="5">WORKSTATION TRIAGE</text>
    <text x="68" y="196" fill="#f2f7ff" font-size="88" font-weight="700" letter-spacing="-5">OpsProbe</text>
    <text x="72" y="246" fill="#a8bad0" font-size="24">Small diagnostics. Useful reports. Private by default.</text>
    <rect x="72" y="281" width="196" height="34" rx="17" fill="#66e2b4" fill-opacity=".1" stroke="#66e2b4" stroke-opacity=".45"/>
    <text x="91" y="304" fill="#99efcf" font-size="14" letter-spacing="2">PYTHON 3.11+</text>
