[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opsprobe"
version = "0.1.0"
description = "A privacy-first workstation diagnostic CLI for IT support teams."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Reed Stelfox" }]
keywords = ["it-support", "diagnostics", "networking", "helpdesk", "systems-administration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[project.scripts]
opsprobe = "opsprobe.cli:main"

[project.urls]
Homepage = "https://github.com/ReedStel/opsprobe"
Issues = "https://github.com/ReedStel/opsprobe/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/opsprobe/reporting.py" = ["E501"]
